name: Bug
description: Algo no funciona como se espera
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasó
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador / dispositivo
  - type: checkboxes
    id: a11y
    attributes:
      label: ¿Afecta accesibilidad?
      options:
        - label: Sí, afecta teclado/lector/contraste